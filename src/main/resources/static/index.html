<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Gestão de Expedientes - SmartSpaces</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
<div class="container" id="loginSection">
    <h1>Acesso ao Sistema</h1>
    <input id="loginEmail" placeholder="E-mail" type="email">
    <input id="loginSenha" placeholder="Senha" type="password">
    <button onclick="fazerLogin()">Entrar</button>
    <p style="text-align: center;">Não tem conta? <a href="#" onclick="mostrarRegisto()">Criar conta</a></p>
    <p id="erroLogin" style="color: red; text-align: center;"></p>
</div>

<div class="container" id="registerSection" style="display: none;">
    <h1>Criar Nova Conta</h1>
    <input id="regNome" placeholder="Nome Completo" type="text">
    <input id="regEmail" placeholder="E-mail" type="email">
    <input id="regSenha" placeholder="Senha" type="password">
    <button onclick="criarConta()">Registar</button>
    <p style="text-align: center;">Já tem conta? <a href="#" onclick="mostrarLogin()">Fazer Login</a></p>
    <p id="msgRegisto" style="text-align: center;"></p>
</div>

<div class="container" id="dashboardSection" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Expedientes</h1>
        <button onclick="logout()" style="width: 80px; background-color: #d9534f;">Sair</button>
    </div>
    <p>Bem-vindo, <strong id="nomeUsuario"></strong> (<span id="papelUsuario"></span>)</p>
    <div class="form-section">
        <h2>Registar Novo Expediente</h2>
        <input id="numeroProcesso" placeholder="Nº do Processo" type="text">
        <input id="assunto" placeholder="Assunto" type="text">
        <input id="remetente" placeholder="Remetente" type="text">
        <button onclick="salvarExpediente()">Registar</button>
    </div>
    <div class="list-section">
        <h2>Lista de Expedientes</h2>
        <table id="tabelaExpedientes">
            <thead>
            <tr>
                <th>Nº Processo</th>
                <th>Assunto</th>
                <th>Remetente</th>
                <th>Estado</th>
                <th id="colunaAcao" style="display: none;">Ação</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
